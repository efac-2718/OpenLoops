# Calls the deployed AI server from Expo's cloud and prints what it answers.
# Run by hand: npx eas-cli@latest workflow:run check-api.yml

name: Check AI server

jobs:
  check:
    name: Call the AI server
    steps:
      - name: Call the endpoints
        run: |
          post() {
            echo "--- POST /api/$1"
            curl -sS --max-time 120 -w "\nHTTP %{http_code} in %{time_total}s\n" -X POST -H 'content-type: application/json' -d "$2" "https://open-loops.expo.app/api/$1" || true
          }
          post sort '{"today":"2026-10-25","weekday":"Sunday","activeCount":0,"activeCap":7,"loops":[{"id":"t1","title":"Buy milk","notes":null,"captured":"2026-10-25"}]}'
          post concrete '{"title":"Taxes","notes":"Due in May","nextAction":"sort out taxes"}'
          post split '{"text":"okay so I need to fix the bike before the weekend and my mum called and I should call her back"}'
